name: qdate tests and dialyzer
on: push

jobs:
  linux:
    name: OTP ${{ matrix.otp_version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            otp_version: '29.x'
            rebar3_version: "3.27.0"
          - os: ubuntu-24.04
            otp_version: '28.x'
            rebar3_version: "3.26.0"
          - os: ubuntu-22.04
            otp_version: '27.x'
            rebar3_version: "3.25.0"
          - os: ubuntu-22.04
            otp_version: '26.x'
            rebar3_version: "3.22.1"
          - os: ubuntu-22.04
            otp_version: '25.x'
            rebar3_version: "3.22.1"
          - os: ubuntu-22.04
            otp_version: '24.x'
            rebar3_version: "3.22.1"

    steps:
      - name: Install OTP ${{matrix.otp_version}}
        uses: erlef/setup-beam@v1
        with:
          version-type: loose
          otp-version: ${{ matrix.otp_version}}
          rebar3-version: ${{ matrix.rebar3_version}}

      - name: Checkout qdate
        uses: actions/checkout@v4

      - name: Run Tests
        run: make test

      - name: Run Dialyzer
        run: make dialyzer
